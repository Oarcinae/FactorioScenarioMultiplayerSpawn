[mod-setting-description]
oarc-classic-welcome-msg-title=Это заголовок приветственного сообщения, которое будет отображаться игрокам, когда они присоединятся к игре.
oarc-classic-welcome-msg=Это приветственное сообщение, которое будет отображаться игрокам при присоединении к игре и на информационной панели. [color=red]Оставьте один пробел, чтобы отключить.[/color]
oarc-classic-discord-invite=Разместите здесь свое приглашение в Discord, чтобы игроки могли легко скопировать его с информационной панели в игре. [color=red]Оставьте один пробел, чтобы отключить.[/color]

oarc-classic-allow-moats-around-spawns=Разрешить игрокам выбирать места появления со рвом вокруг них.
oarc-classic-enable-moat-bridging=Если зона появления окружена сушей, ров будет иметь небольшой сухопутный мост, соединяющий его.

oarc-classic-enable-offline-protection=Это запрещает атаки противника на базы, где все игроки находятся в автономном режиме. Не 100% гарантия!
oarc-classic-enable-shared-team-vision=Гарантирует, что все команды могут видеть карту и радарное покрытие друг друга. Для этого нужны дружные команды!
oarc-classic-enable-shared-team-chat=Все команды могут видеть сообщения чата друг друга.
oarc-classic-enable-friendly-teams=Все команды дружелюбны друг к другу. Друзья имеют неограниченный доступ к зданиям, и турели не будут стрелять по ним.
oarc-classic-enable-cease-fire=Все команды находятся в режиме прекращения огня. Турели не будут стрелять по другим командам.
oarc-classic-enable-shared-spawns=Разрешить игрокам делиться своими зонами появления, чтобы другие игроки могли присоединиться к ним.
oarc-classic-number-of-players-per-shared-spawn=Количество игроков, которые могут присоединиться к общему спавну, включая исходного игрока.
oarc-classic-enable-friendly-fire=Включает дружественный огонь. Так что вы можете расстреливать свои сундуки (или сбивать друзей поездом). Это позволит вам нанести урон СОБСТВЕННОЙ команде.
 
oarc-classic-default-surface=Поверхность по умолчанию, на которую будут спауниться игроки, если они присоединятся к основной команде или если спаунинг на другие поверхности не включен.
oarc-classic-minimum-online-time=Минимальное время, в течение которого игрок должен находиться в сети перед уходом, иначе его зона спавна будет зачищена.
oarc-classic-respawn-cooldown-min=Минимальное время, которое игрок должен выждать, чтобы сменить точку спавна на новую.

oarc-classic-enable-regrowth=Включает отрастание. Это медленно удаляет неактивные фрагменты с течением времени. Чанки со структурами игроков не будут удалены. Это помогает уменьшить размер карты (и размер файла) со временем.
oarc-classic-enable-world-eater=Включает пожирание мира. Для этого требуется регенерация. При этом медленно проверяются все чанки на отсутствие структур и сущностей игроков и помечаются для удаления. Это помогает уменьшить размер карты (и размер файла) со временем. Это скорее экспериментальная функция, используйте на свой страх и риск.
oarc-classic-enable-abandoned-base-cleanup=Брошенные базы будут очищаться, если игроки покидают их в течение короткого времени после присоединения. [color=red]Для этого НЕ требуется включать регенерацию или пожирателя миров[/color].
oarc-classic-regrowth-cleanup-interval-min=Это интервал в минутах, через который будет выполняться очистка регров. Когда происходит очистка карты, игра на секунду замирает, поэтому не стоит запускать эту функцию слишком часто! Очистка покинутой базы происходит сразу после ухода игрока, и эта настройка на нее не влияет.

oarc-classic-spawn-general-radius-tiles=Это радиус области спавна в тайлах. Я бы не стал делать это значение меньше 2 кусков (64) и не слишком большим, если вы не хотите, чтобы спавны генерировались очень долго.
oarc-classic-spawn-general-moat-width-tiles=Это ширина рва вокруг зоны спавна в тайлах, если ров включен и выбран во время спавна.
oarc-classic-spawn-general-tree-width-tiles=Это ширина кольца деревьев вокруг зоны спавна в тайлах. Это гарантирует наличие деревьев рядом со спавном.
oarc-classic-spawn-general-enable-resources-circle-shape=Это форма залежей ресурсов в стартовой зоне.
oarc-classic-spawn-general-enable-force-tiles=При включении этой опции вся зона спавна будет заполнена определенной плиткой (трава на Наувисе). В противном случае для заполнения пробелов будет использоваться полигон.
oarc-classic-spawn-general-shape=Это форма области спавна.

oarc-classic-resource-placement-enabled=Вы должны оставить этот параметр включенным, если только вы не указываете размещение ресурсов вручную в пользовательском сценарии!
oarc-classic-resource-placement-distance-to-edge=Это расстояние от края области спавна, на котором будут размещаться ресурсы. Применяется только для спавнов в форме круга или восьмиугольника.
oarc-classic-resource-placement-degrees-offset=Это начальное угловое смещение (в градусах) для размещения ресурсов. Под каким углом (в градусах) начинаются ресурсы.  0 = восток. 90 = юг. Ресурсы размещаются по часовой стрелке, начиная с этого угла. Применяется только для спавнов в форме круга или восьмиугольника.
oarc-classic-resource-placement-degrees-final=Это конечное угловое смещение (в градусах) для размещения ресурсов. Под каким углом (в градусах) заканчиваются ресурсы. 0 = восток. 90 = юг. Ресурсы размещаются по часовой стрелке, заканчиваясь под этим углом. Применяется только для спавнов в форме круга или восьмиугольника.
oarc-classic-resource-placement-vertical-offset=Это вертикальное смещение (в тайлах) для размещения ресурсов от левого верхнего угла спавна. Применяется только для спавнов квадратной формы.
oarc-classic-resource-placement-horizontal-offset=Это горизонтальное смещение (в тайлах) для размещения ресурсов от левого верхнего угла спавна. Применяется только для спавнов квадратной формы.
oarc-classic-resource-placement-linear-spacing=Это линейное расстояние (в тайлах) между ресурсами. Применяется только для спавнов квадратной формы.
oarc-classic-resource-placement-size-multiplier=Это изменяет размер залежей ресурсов. Настройки по умолчанию должны обеспечить близкий к ванильному стартовый опыт.
oarc-classic-resource-placement-amount-multiplier=Это изменяет богатство залежей ресурсов. Настройки по умолчанию должны обеспечить близкий к ванильному стартовый опыт.

;"circle" | "octagon" | "square"
