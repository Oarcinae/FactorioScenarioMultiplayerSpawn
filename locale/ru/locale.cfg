oarc-research-finished-infinite=Команда __1__ закончила исследование [img=technology.__2__] [color=green][Технология: __3__ __4__][/color]!

oarc-command-dude-wheres-my-cargo-pod=Это попытается телепортировать к вам из центра карты все грузовые контейнеры вашей команды. Используйте это, если грузовой контейнер приземлился в центре карты, а не на вашем спавне.
oarc-command-reroll-spawn=Перемещает ваш спавн на текущей поверхности в следующую свободную стартовую точку. Это можно сделать один раз на каждой поверхности. Администраторы могут перемещать спавн любого игрока сколько угодно: /oarc-reroll-spawn [игрок] Внимание: всё, что построено или приземлилось на текущем спавне, будет потеряно. Если там что-то есть, вы сначала получите предупреждение и сможете в течение 60 секунд повторить команду. Перемещение недоступно, пока грузовой контейнер в пути или рядом находится игрок другой команды.
oarc-spawn-rerolled=__1__ переместил свой спавн на __2__!
oarc-reroll-spawn-command=Если с вашим спавном что-то не так, вы можете один раз переместить его командой /oarc-reroll-spawn. Внимание: всё, что построено или приземлилось на текущем спавне, будет потеряно. Если там что-то есть, вы сначала получите предупреждение и сможете в течение 60 секунд повторить команду. Перемещение недоступно, пока грузовой контейнер в пути или рядом находится игрок другой команды.
oarc-reroll-used-up=Вы уже перемещали свой спавн на __1__. Если нужно ещё раз, попросите администратора.
oarc-reroll-no-spawn=У __1__ нет собственного спавна на __2__. Переместить спавн может только его владелец, находясь на этой поверхности.
oarc-reroll-no-character=У __1__ сейчас нет персонажа, поэтому его спавн нельзя переместить.
oarc-reroll-confirm-warning=В пределах 3 чанков от спавна __3__ на __4__ находятся постройки (__1__) и приземлившиеся грузовые контейнеры с предметами (__2__). Они будут потеряны. Повторите команду в течение 60 секунд, чтобы всё равно переместить спавн.
oarc-reroll-blocked-player=__1__ находится на спавне на __2__. Нельзя переместить спавн, пока игрок другой команды находится в пределах 3 чанков.
oarc-reroll-blocked-cargo-pod=Грузовой контейнер ещё летит на __1__. Дождитесь его приземления и попробуйте снова.
oarc-command-cleanup-player=Удаляет базу игрока и сбрасывает его. Это то же самое, что происходит, когда игрок рано покидает игру. Полезно для очистки заброшенных баз. Подтверждения НЕТ, и отменить это НЕЛЬЗЯ, будьте осторожны!
oarc-command-cleanup-player-usage=Использование: /oarc-cleanup-player [имя_игрока]
oarc-command-cleanup-player-online=Игрок должен быть офлайн, чтобы использовать эту команду!
oarc-command-not-admin-warning=Невозможно выполнить команду (__1__) - вы не администратор.
