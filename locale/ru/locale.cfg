oarc-classic-faq-what-is-this-mod=Что это за мод?
oarc-classic-faq-what-is-this-mod-answer=Этот мод даёт каждому игроку собственную стартовую зону и собственную силу (команду). Отличие этой "классической" версии от моего оригинального мода в том, что она использует встроенную в Factorio поддержку нескольких стартовых точек на каждой поверхности, поэтому она должна быть гораздо лучше совместима с другими модами. Кроме того, в Space Age всё работает как в обычной игре: грузовые контейнеры приземляются в нужном месте, и никаких хаков с телепортацией. Всё остальное, что не является строго необходимым для основной функциональности мода, я убрал. Главное ограничение: у каждой силы может быть только одна стартовая точка. Если вы хотите быть в одной силе с другими игроками, нужно присоединиться к их базе. Этот мод создан для кооперативной игры, а не для PvP.

oarc-classic-faq-starting-points=Как выбирается место моего спавна?
oarc-classic-faq-starting-points-answer=Хост сервера задаёт, сколько стартовых точек есть на каждой планете и на каком расстоянии они друг от друга. Новые спавны занимают следующую свободную точку, по спирали от центра карты. Точка пропускается, если кто-то уже исследовал область вокруг неё. Если спавн очищается, его область генерируется заново, и точку можно использовать снова. Ограничения на число игроков нет, но когда все точки заняты, новым игрокам придётся присоединиться к чужому спавну.

oarc-classic-faq-oarc-style-spawn=Что такое спавн в стиле OG Oarc?
oarc-classic-faq-oarc-style-spawn-answer=Если хост это разрешил, в меню спавна есть флажок "Спавн в стиле OG Oarc". Он строит классический готовый круг спавна в вашей стартовой зоне: круг гарантированной суши с кольцом деревьев, заранее заданные стартовые ресурсы, полосу жидкости и, по желанию, ров. Иначе вы получите ванильную стартовую зону. Ваши стартовые зоны на других планетах используют тот же стиль, что вы выбрали на первой планете.

oarc-classic-faq-other-surfaces=Могу ли я начать на другой поверхности/планете?
oarc-classic-faq-other-surfaces-answer=[color=red]Я рекомендую начинать только на [planet=nauvis] __PLANET__nauvis__ или похожей на __PLANET__nauvis__ поверхности.[/color] Коротко: можно, но вряд ли вам это нужно. Нет простого способа начать на других планетах, не сломав обычный ход игры. Есть другие моды, например Any Planet Start, но их совместимость я ещё не проверял.

oarc-classic-faq-secondary-spawns=Что происходит на других планетах?
oarc-classic-faq-secondary-spawns-answer=Когда вы впервые прилетаете на другую планету, вы автоматически получаете новую стартовую точку на этой планете, как в обычной игре, в том же стиле, что и ваш первый спавн. Ваши грузовые контейнеры без проблем отправляются в эту зону высадки, независимо от того, кто приземлится первым: вы или ваш груз. На [planet=fulgora] __PLANET__fulgora__ громоотводы, созданные генерацией карты, принадлежат команде с ближайшим спавном, поэтому вы можете разобрать те, что рядом с вашей базой.

oarc-classic-faq-reroll=Мне не нравится мой спавн, что делать?
oarc-classic-faq-reroll-answer=Используйте /oarc-reroll-spawn, находясь на этой планете, чтобы переместить спавн в следующую свободную стартовую точку. Старая зона спавна удаляется, если включена очистка заброшенных баз, а игроки, присоединившиеся к вам там, переезжают вместе с вами. Если свободных стартовых точек нет, ничего не произойдёт, и попытка у вас останется. Администраторы могут перемещать спавн любого игрока сколько угодно командой /oarc-reroll-spawn [игрок]. Внимание: всё, что построено или приземлилось на текущем спавне, будет потеряно. Если там что-то есть, вы сначала получите предупреждение и сможете в течение 60 секунд повторить команду. Перемещение недоступно, пока грузовой контейнер в пути или рядом находится игрок другой команды.

oarc-classic-faq-what-are-teams=Какие существуют варианты команд?
oarc-classic-faq-what-are-teams-answer=Я написал этот мод только для кооперативной игры, не для PvP, но вы можете отключить перемирие и дружественные команды в настройках, если очень хочется. Каждый игрок, создающий новый спавн, получает собственную команду со своим деревом исследований. Игроки, присоединившиеся к чужому спавну, попадают в команду его владельца. Все команды дружелюбны друг к другу, могут общаться в чате и (по желанию) делиться видимостью карты.

oarc-classic-faq-evolution-reset=Почему сбросилась эволюция врагов?
oarc-classic-faq-evolution-reset-answer=Если хост включил "Сброс эволюции при новом спавне", эволюция врагов на планете сбрасывается до 0 каждый раз, когда кто-то создаёт там новый спавн (включая вторичные спавны и перемещение спавна), чтобы опоздавшие игроки не начинали против полностью эволюционировавших врагов. Это затрагивает всех на этой планете. Присоединение к чужому спавну эволюцию не сбрасывает.

oarc-classic-faq-shared-spawn=Что такое общий спавн?
oarc-classic-faq-shared-spawn-answer=Игроки могут разрешить другим игрокам присоединиться к их базе. Это позволяет новым игрокам спавниться в той же стартовой зоне, что и игрок-хозяин. Игрок-хозяин может контролировать, кто может присоединиться к их базе.

oarc-classic-faq-regrowth=Что такое функции восстановления и "мировой пожиратель"?
oarc-classic-faq-regrowth-answer="Восстановление" помогает уменьшить размер файла сохранения, удаляя неактивные куски карты со временем. Это полезно для долго работающих серверов с множеством игроков. Никакие куски с активностью игроков не будут удалены. "Мировой пожиратель" медленно проверяет каждый кусок, чтобы увидеть, есть ли в нем какие-либо структуры игроков. Это дополнительная проверка поверх функции восстановления, которая поймает любые куски, на которых игроки что-то построили, но затем удалили все структуры. Честно говоря, я не рекомендую включать ни одну из них, если только вас действительно не беспокоит размер файла сохранения в долгих играх.

oarc-classic-faq-cleanup-abandoned=Что такое функция очистки заброшенных баз?
oarc-classic-faq-cleanup-abandoned-answer=Если игрок покидает игру раньше "минимального времени онлайн", его персонаж и зона спавна удаляются. Зона генерируется заново как свежая стартовая зона, а стартовая точка возвращается в общий пул для следующего нового игрока. Общественные серверы, вероятно, захотят включить эту функцию. Она работает, даже если восстановление и мировой пожиратель отключены.

oarc-classic-faq-offline-protection=Что такое функция защиты офлайн?
oarc-classic-faq-offline-protection-answer=Если все игроки базы находятся офлайн, база будет защищена от атак врагов. Это не гарантировано на 100%, но это поможет предотвратить разрушение базы, пока игроки офлайн.

oarc-surface-settings-info=Это позволяет настроить параметры поверхности, доступно только администраторам. Эти параметры НЕДОСТУПНЫ на странице настроек мода. Если вы хотите автоматически установить их в начале новой игры с помощью пользовательского файла, пожалуйста, посмотрите включенный шаблон сценария в папке мода. Я действительно сомневаюсь в своей здравом рассудке, удосужившись создать этот интерфейс GUI. Отправьте помощь.
oarc-surface-settings-warning=ПРЕДУПРЕЖДЕНИЕ: Эти параметры НЕ обрабатываются, вы можете вызвать сбой игры, если выберете неправильные значения!
oarc-surface-settings-prefab-only-note=Ресурсы зоны спавна и полоса жидкости размещаются только в спавнах в стиле Oarc. Включите "Разрешить круглый спавн в стиле Oarc" в настройках мода, чтобы настроить их здесь.

