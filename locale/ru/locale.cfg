oarc-settings-tab-surface-checkbox-tooltip=Включение этого параметра позволит игрокам создавать свои собственные области спауна (основная функция мода) на этой поверхности. Вам нужно включить хотя бы один из этих параметров, чтобы мод работал.
oarc-settings-tab-surface-secondary-checkbox-tooltip=Включение этого параметра даст игрокам отдельные места высадки. Теперь, когда в моде есть ванильные спавны, эта функция должна быть безопасной. Это главная суть мода, поэтому она включена по умолчанию. Если её отключить, игроки будут приземляться в точке 0,0 на этой поверхности и не получат собственную зону спавна. Это не рекомендуется.
