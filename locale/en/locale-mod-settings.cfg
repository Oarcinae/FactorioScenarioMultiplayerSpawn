[mod-description]
oarc-classic=A multiplayer spawn mod built on vanilla starting areas. Every planet gets a fixed grid of starting points when the game starts, and each new player takes the next free one, spiralling out from the center. Players can also join someone else's spawn. Check the mod settings and in game GUI for more information.\n\n[font=default-small]To start a new game with this mod, just use the default freeplay scenario.[/font]

