[mod-description]
oarc-classic=A multiplayer spawn mod built on vanilla starting areas. Every planet gets a fixed grid of starting points when the game starts, and each new player takes the next free one, spiralling out from the center. Players can also join someone else's spawn.\n\n[color=red][font=default-bold]Please check out the github page and discord for more information and support.[/font][/color]\n\n[font=default-small]To start a new game with this mod, just use the default freeplay scenario. The scenario included in this mod is only a template for server hosts who want to set config values from a file before the game starts. Please read the control.lua file inside the scenario for notes.[/font]

