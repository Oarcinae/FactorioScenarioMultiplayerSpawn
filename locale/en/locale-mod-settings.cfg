[mod-setting-description]
oarc-classic-welcome-msg-title=This is the title of the welcome message that will be displayed to players when they join the game.
oarc-classic-welcome-msg=This is the welcome message that will be displayed to players when they join the game and in the info panel. [color=red]Leave a single space to disable.[/color]
oarc-classic-discord-invite=Place your discord invite here so players can easily copy it from the in game info panel. [color=red]Leave a single space to disable.[/color]

oarc-classic-allow-oarc-style-spawn=Shows a checkbox in the spawn menu that lets players pick the OG Oarc style spawn circle instead of the vanilla starting area. It builds a land circle with a tree ring, an optional moat, a liquid strip and scripted starting resources on top of their starting point. The moat, spawn area and resource placement settings only apply to these spawns. Secondary spawns on other planets use the same style as the player's first spawn. Disabling this only affects new spawns.
oarc-classic-allow-moats-around-spawns=Allow players to choose spawns with a moat around them. Only applies to Oarc style spawns.
oarc-classic-enable-moat-bridging=If the spawn area is surrounded by land, the moat will have a small land bridge connecting it.
oarc-classic-starting-points-count=Number of fixed starting points on each planet. Each new spawn takes the next free one, spiralling out from the center of the map. Only read when a new game starts.
oarc-classic-starting-points-spacing-chunks=Distance between neighbouring starting points, in chunks. Only read when a new game starts.

oarc-classic-enable-offline-protection=This inhibits enemy attacks on bases where all players are offline. Not 100% guaranteed!
oarc-classic-reset-evolution-on-new-spawn=Whenever a player starts a new spawn, enemy evolution on that planet is reset to 0, so late joiners don't start against fully evolved biters. Secondary spawns on other planets reset that planet too. Joining someone else's spawn doesn't reset anything. [color=red]This resets evolution for EVERYONE on that planet, not just the new player![/color]
oarc-classic-enable-shared-team-vision=Makes sure all teams can see each other's map and radar coverage. This requires friendly teams!
oarc-classic-enable-shared-team-chat=All teams can see each other's chat messages.
oarc-classic-enable-friendly-teams=All teams are friendly to each other. Friends have unrestricted access to buildings and turrets won't fire at them.
oarc-classic-enable-cease-fire=All teams are at cease fire. Turrets will not fire at other teams.
oarc-classic-enable-shared-spawns=Allow players to share their spawn areas for other players to join.
oarc-classic-number-of-players-per-shared-spawn=Number of players that can join a shared spawn, including the original player.
oarc-classic-enable-friendly-fire=Enables friendly fire. So you can shoot your chests (or run over your friends with a train). This lets you damage your OWN team.

oarc-classic-default-surface=The surface that players make their first spawn on, unless they pick another surface that allows spawns.

oarc-classic-minimum-online-time=The minimum time a player must be online before they leave, otherwise their spawn area will be cleaned up.
oarc-classic-respawn-cooldown-min=The minimum time a player must wait before they can change their respawn point to a new location.

oarc-classic-enable-regrowth=Enables regrowth. This slowly removes inactive chunks over time. Any chunk with player structures will not be removed. This helps to keep the map (and file size) smaller over time.
oarc-classic-enable-world-eater=Enables world eater. This requires regrowth. This slowly checks all chunks for a lack of player structures and entities and marks them for removal. This helps to keep the map (and file size) smaller over time. This is more of an experimental feature, use at your own risk.
oarc-classic-enable-abandoned-base-cleanup=Abandoned bases will be cleaned up if players leave within a short time of joining. [color=red]This does NOT require regrowth or world eater to be enabled.[/color]
oarc-classic-regrowth-cleanup-interval-min=This is the interval in minutes that the regrowth cleanup will run. Whenever a map cleanup happens, the game freezes for a second, so you don't want to run this too often! Abandoned base cleanup happens immediately when a player leaves and is not affected by this setting.

oarc-classic-spawn-general-radius-tiles=This is the radius of the spawn area in tiles. I would not make this much smaller then 2 chunks (64) and not too huge unless you want spawns to take a long time to generate.
oarc-classic-spawn-general-moat-width-tiles=This is the width of the moat around the spawn area in tiles, if a moat is enabled and selected at spawn time.
oarc-classic-spawn-general-tree-width-tiles=This is the width of the tree ring around the spawn area in tiles. It guarantees some trees near to spawn.
oarc-classic-spawn-general-enable-resources-circle-shape=This is the shape of the starting area resource deposits.
oarc-classic-spawn-general-enable-force-tiles=Enabling this will fill the entire spawn area with a specific tile (grass on Nauvis). Otherwise, landfill will be used as needed to fill in any gaps instead.
oarc-classic-spawn-general-shape=This is the shape of the spawn area.

oarc-classic-resource-placement-enabled=You should leave this enabled unless you are manually specifying resource placements in the custom scenario!
oarc-classic-resource-placement-distance-to-edge=This is the distance from the edge of the spawn area that resources will be placed. Only applicable for circle/octagon shaped spawns.
oarc-classic-resource-placement-degrees-offset=This is the starting angle offset (in degrees) for the resource placement. At what angle (in degrees) do resources start.  0 = east. 90 = south. Resources are placed clockwise starting at this angle. Only applicable for circle/octagon shaped spawns.
oarc-classic-resource-placement-degrees-final=This is the final angle offset (in degrees) for the resource placement. At what angle (in degrees) do resources end. 0 = east. 90 = south. Resources are placed clockwise ending at this angle. Only applicable for circle/octagon shaped spawns.
oarc-classic-resource-placement-vertical-offset=This is the vertical offset (in tiles) for the resource placement from the top-left of the spawn. Only applicable for square shaped spawns.
oarc-classic-resource-placement-horizontal-offset=This is the horizontal offset (in tiles) for the resource placement from the top-left of the spawn. Only applicable for square shaped spawns.
oarc-classic-resource-placement-linear-spacing=This is the linear spacing (in tiles) between resources. Only applicable for square shaped spawns.
oarc-classic-resource-placement-size-multiplier=This changes the size of the resource deposits. Default settings should provide close to a vanilla starting experience.
oarc-classic-resource-placement-amount-multiplier=This changes the richness of the resource deposits. Default settings should provide close to a vanilla starting experience.

;"circle" | "octagon" | "square"
