oarc-classic-faq-what-is-this-mod=What is this mod?
oarc-classic-faq-what-is-this-mod-answer=This mod overhauls multiplayer spawning. Every planet gets a set of starting points when the game starts using Factorio's built-in system. Each player can choose to use one of these starting points, which are just like a normal game. Players can also join other players' bases instead. The mod does not change the core gameplay of Factorio, only the way players start the game. The one major limitation is that a single force can't have multiple starting areas on the same planet. Working around Factorio's limitation of one landing hub per force isn't worth it. Each starting area is on its own team, with its own research tree. Players can choose to allow other players to join their base, which allows them to share a starting area and team. This mod is designed for co-op play, not pvp.
oarc-classic-faq-starting-points=How is my spawn location chosen?
oarc-classic-faq-starting-points-answer=The server host picks how many starting points each planet has and how far apart they are. New spawns take the next free point, spiralling out from the center of the map. A point is skipped if anyone has already explored the area around it. If a spawn is cleaned up, its area is regenerated and the point can be used again. There is no join limit, but once every point is taken, new players have to join someone else's spawn.
oarc-classic-faq-oarc-style-spawn=What is an OG Oarc style spawn?
oarc-classic-faq-oarc-style-spawn-answer=If the host allows it, the spawn menu has an "OG Oarc style spawn" checkbox. It builds the classic prefab spawn circle in your starting area: a circle of guaranteed land with a tree ring, pre-set starting resources, a liquid strip and an optional moat. Otherwise you get the vanilla starting area. Your starting areas on other planets use the same style as your first planet's choice.
oarc-classic-faq-other-surfaces=Can I start on a different surface/planet?
oarc-classic-faq-other-surfaces-answer=[color=red]I only recommend starting on [planet=nauvis] __PLANET__nauvis__ or a __PLANET__nauvis__-like surface.[/color] The short answer is yes, but you probably don't want to. There is no simple way to ensure that you can start on other planets without breaking the normal progression and gameplay. There are other mods out there, like Any Planet Start, but I have not tested compatibility yet.
oarc-classic-faq-secondary-spawns=What are secondary spawns?
oarc-classic-faq-secondary-spawns-answer=When you first travel to another planet, you automatically get a separate landing area on that planet's next free starting point, using the same spawn style as your first spawn. Your cargo pods are sent to that landing area. On [planet=fulgora] __PLANET__fulgora__, lightning attractors from map generation belong to the team with the closest spawn, so you can deconstruct the ones near your base. [color=red]Please report issues on discord/github.[/color]
oarc-classic-faq-reroll=Can I move my spawn somewhere else?
oarc-classic-faq-reroll-answer=Yes, once per planet. Use /oarc-reroll-spawn while standing on that planet to move your spawn to the next free starting point. Your old spawn area is deleted if abandoned base cleanup is on, and any players who joined you there move with you. If there are no free starting points, nothing happens and you keep your reroll. Admins can reroll anyone, as often as they want, with /oarc-reroll-spawn [player].
oarc-classic-faq-what-are-teams=What are the different team options?
oarc-classic-faq-what-are-teams-answer=I wrote this mod for co-op play only, not pvp, but you can disable cease fire and friendly teams in the settings if you really want to. Every player who starts a new spawn gets their own team, with its own research tree. Players who join someone else's spawn join that player's team. All teams are friendly to each other and can communicate in chat and (optionally) share map vision.
oarc-classic-faq-evolution-reset=Why did enemy evolution reset?
oarc-classic-faq-evolution-reset-answer=If the host enabled "Reset evolution on new spawn", enemy evolution on a planet goes back to 0 every time someone starts a new spawn there (including secondary spawns and rerolls), so late joiners don't start against fully evolved enemies. This affects everyone on that planet. Joining someone else's spawn does not reset it.
oarc-classic-faq-shared-spawn=What is a shared spawn?
oarc-classic-faq-shared-spawn-answer=Players can choose to allow other players to join their base. This allows new players to spawn in the same starting area as the host player. The host player can control who can join their base.
oarc-classic-faq-regrowth=What are the regrowth and world eater features?
oarc-classic-faq-regrowth-answer="Regrowth" helps keep the save file size down by removing inactive map chunks over time. This is useful for long-running servers with many players. No chunks with player activity will be removed. "World Eater" slowly checks every chunk to see if there are any player structures in it. This is an additional check on top of the regrowth feature that will catch any chunks that players built on, but then later removed all structures from.
oarc-classic-faq-cleanup-abandoned=What is the cleanup abandoned bases feature?
oarc-classic-faq-cleanup-abandoned-answer=If a player leaves within the "minimum online time", this deletes their character and their spawn area. The area is regenerated as a fresh starting area, and the starting point goes back into the pool for the next new player. Public servers likely want to enable this feature. It works even when regrowth and world eater are disabled.
oarc-classic-faq-offline-protection=What is the offline protection feature?
oarc-classic-faq-offline-protection-answer=If a base has all players offline, it will be protected from enemy attacks. This is not 100% guaranteed, but it will help prevent the base from being destroyed while players are offline.

oarc-surface-settings-info=This lets you configure the surface settings, it is only available to admins. These settings are NOT available in the mod settings page. If you want to automatically set these on the start of a new game using a custom file, please check out the included template scenario in the mod folder. I really question my sanity for bothering to make this GUI interface. Send help.
