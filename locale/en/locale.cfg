oarc-classic-faq-what-is-this-mod=What is this mod?
oarc-classic-faq-what-is-this-mod-answer=This mod overhauls multiplayer spawning. Every planet gets a fixed grid of starting points when the game starts, and each new player gets their own spawn at the next free point. Players can also join other players' bases. The mod does not change the core gameplay of Factorio, only the way players start the game.
oarc-classic-faq-other-surfaces=Can I start on a different surface/planet?
oarc-classic-faq-other-surfaces-answer=[color=red]I only recommend starting on [planet=nauvis] __PLANET__nauvis__ or a __PLANET__nauvis__-like surface.[/color] The short answer is yes, but you probably don't want to. There is no simple way to ensure that you can start on other planets without breaking the normal progression and gameplay. There are other mods out there, like Any Planet Start, but I have not tested compatibility yet.
oarc-classic-faq-secondary-spawns=What are secondary spawns?
oarc-classic-faq-secondary-spawns-answer=If enabled, when a player first travels to a new planet/surface, they will automatically be given a separate landing area based on their primary spawn choice (the first spawn they create). [color=red]This feature is currently a work in progress, but I have now added support for the Space Age planets ([planet=fulgora] __PLANET__fulgora__, [planet=gleba] __PLANET__gleba__, [planet=vulcanus] __PLANET__vulcanus__, and [planet=aquilo] __PLANET__aquilo__).[/color] There are some known issues, such as cargo-pods landing at the center of the map if you don't have a landing pad setup yet (use the /oarc-wheres-my-cargo-pod command to retrieve them). Additionally, Vulcanus doesn't yet provide any API support to modify demolishers or territories, so I have a crude safety mechanism that removes demolishers close to your spawn area. All planets should still be playable, but it's not perfect. Please report issues to me on discord/github.
oarc-classic-faq-what-are-teams=What are the different team options?
oarc-classic-faq-what-are-teams-answer=I wrote this mod for co-op play only, not pvp, but you can disable cease fire and friendly teams in the settings. Every player who starts a new spawn gets their own team, with its own research tree. Players who join someone else's spawn join that player's team. All teams are friendly to each other and can communicate in chat and (optionally) share map vision.
oarc-classic-faq-shared-spawn=What is a shared spawn?
oarc-classic-faq-shared-spawn-answer=Players can choose to allow other players to join their base. This allows new players to spawn in the same starting area as the host player. The host player can control who can join their base.
oarc-classic-faq-regrowth=What are the regrowth and world eater features?
oarc-classic-faq-regrowth-answer="Regrowth" helps keep the save file size down by removing inactive map chunks over time. This is useful for long-running servers with many players. No chunks with player activity will be removed. "World Eater" slowly checks every chunk to see if there are any player structures in it. This is an additional check on top of the regrowth feature that will catch any chunks that players built on, but then later removed all structures from.
oarc-classic-faq-cleanup-abandoned=What is the cleanup abandoned bases feature?
oarc-classic-faq-cleanup-abandoned-answer=This removes the spawn area if the player leaves within the "minimum online time" and will also delete their character. This feature is useful for keeping the map clean and the save file size down. Public servers likely want to enable this feature.
oarc-classic-faq-offline-protection=What is the offline protection feature?
oarc-classic-faq-offline-protection-answer=If a base has all players offline, it will be protected from enemy attacks. This is not 100% guaranteed, but it will help prevent the base from being destroyed while players are offline.

oarc-surface-settings-info=This lets you configure the surface settings, it is only available to admins. These settings are NOT available in the mod settings page. If you want to automatically set these on the start of a new game using a custom file, please check out the included template scenario in the mod folder. I really question my sanity for bothering to make this GUI interface. Send help.
oarc-surface-settings-warning=WARNING: These settings are NOT sanitized, you might crash the game if you pick bad values!
oarc-surface-settings-prefab-only-note=Spawn area resources and the liquid strip are only placed in Oarc style spawns. Enable "Allow Oarc Style Spawn Circle" in the mod settings to configure them here.

