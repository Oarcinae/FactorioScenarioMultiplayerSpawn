oarc-classic-faq-what-is-this-mod=Was ist dieser Mod?
oarc-classic-faq-what-is-this-mod-answer=Dieser Mod überarbeitet den Mehrspieler-Spawn. Spieler können ihre eigenen Spawn-Punkte abseits des Kartenmittelpunkts erstellen. Spieler können auch anderen Spielern beitreten oder Mitspieler-Spawns erstellen. Der Mod ändert das grundlegende Gameplay von Factorio nicht, sondern beeinflusst nur, wie die Spieler das Spiel beginnen. Das Startgebiet ist ein voreingestelltes Gebiet mit Ressourcen, kein „natürlicher“ Spawn-Punkt.
oarc-classic-faq-other-surfaces=Kann ich auf einer anderen Oberfläche/Planet starten?
oarc-classic-faq-other-surfaces-answer=[color=red]Dieses Feature ist derzeit in Arbeit. Daher funktioniert das Spawnen nur auf __PLANET__nauvis__ oder einer standardmäßigen __PLANET__nauvis__-ähnlichen Oberfläche korrekt.[/color]
oarc-classic-faq-secondary-spawns=Was sind sekundäre Spawns?
oarc-classic-faq-secondary-spawns-answer=Wenn aktiviert, erhalten Spieler beim ersten Betreten einer neuen Oberfläche mit benutzerdefiniertem Spawn automatisch ein neues Startgebiet basierend auf ihrer primären Spawn-Wahl (dem ersten Spawn, den sie erstellen). [color=red]Dieses Feature ist derzeit in Arbeit. Sekundäre Spawns auf anderen Oberflächen können Probleme verursachen.[/color]
oarc-classic-faq-what-are-teams=Was sind die verschiedenen Team-Optionen?
oarc-classic-faq-what-are-teams-answer=Dieser Mod ist für Koop-Spiel, nicht für PvP. Abhängig von den Mod-Einstellungen kannst du entweder dem Hauptteam beitreten, das Forschung teilt, oder dein eigenes Team erstellen, das seinen eigenen Forschungsbaum hat. Alle Teams/Fraktionen sind freundlich zueinander und können im Chat kommunizieren und (optional) die Kartenansicht teilen. Der einzige Grund, ein eigenes Team zu erstellen, besteht darin, deinen eigenen Forschungsfortschritt zu haben.
oarc-classic-faq-shared-spawn=Was ist ein geteilter Spawn?
oarc-classic-faq-shared-spawn-answer=Spieler können anderen Spielern erlauben, ihrer Basis beizutreten. Dies ermöglicht es neuen Spielern, im selben Startgebiet wie der Host-Spieler zu spawnen. Der Host-Spieler kann kontrollieren, wer seiner Basis beitreten darf.
oarc-classic-faq-regrowth=Was sind die Regrowth- und "Weltfresser"-Funktionen?
oarc-classic-faq-regrowth-answer="Regrowth" hilft, die Speicherdateigröße zu reduzieren, indem inaktive Kartenabschnitte im Laufe der Zeit entfernt werden. Dies ist nützlich für langfristige Server mit vielen Spielern. Keine Bereiche mit Spieleraktivität werden entfernt. Der "Weltfresser" überprüft langsam jeden Kartenabschnitt, um zu sehen, ob dort Spielerstrukturen vorhanden sind. Dies ist eine zusätzliche Überprüfung zur Regrowth-Funktion, die Kartenabschnitte erfasst, in denen Spieler gebaut, aber später alle Strukturen entfernt haben.
oarc-classic-faq-cleanup-abandoned=Was ist die Funktion „Aufräumen verlassener Basen“?
oarc-classic-faq-cleanup-abandoned-answer=Dies entfernt das Spawn-Gebiet, wenn der Spieler innerhalb der „Mindest-Onlinestunden“ das Spiel verlässt und löscht auch seinen Charakter. Diese Funktion ist nützlich, um die Karte sauber zu halten und die Speicherdateigröße zu reduzieren. Öffentliche Server sollten diese Funktion wahrscheinlich aktivieren.
oarc-classic-faq-offline-protection=Was ist die Funktion "Offline-Schutz"?
oarc-classic-faq-offline-protection-answer=Wenn eine Basis keine Spieler online hat, wird sie vor feindlichen Angriffen geschützt. Dies ist nicht 100% garantiert, aber es hilft, die Basis zu schützen, wenn die Spieler offline sind.

oarc-surface-settings-info=Hiermit können Sie die Oberflächeneinstellungen konfigurieren. Diese Funktion ist nur für Administratoren verfügbar. Diese Einstellungen sind NICHT auf der Mod-Einstellungsseite verfügbar. Wenn Sie diese Einstellungen beim Start eines neuen Spiels automatisch mithilfe einer benutzerdefinierten Datei festlegen möchten, sehen Sie sich bitte das im Mod-Ordner enthaltene Vorlagenszenario an. Ich frage mich wirklich, warum ich mir die Mühe gemacht habe, dieses GUI-Interface zu erstellen. Bitte um Hilfe.
oarc-surface-settings-warning=WARNUNG: Diese Einstellungen sind NICHT bereinigt. Das Spiel könnte abstürzen, wenn Sie schlechte Werte auswählen!

