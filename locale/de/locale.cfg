oarc-character-invalid=Dein Charakter muss gültig sein, um dies zu nutzen! Stelle sicher, dass du nicht in einem Fahrzeug sitzt und nicht tot bist!
oarc-teleport-cargo-pod-fail=Es wurde kein sicherer Ort in deiner Nähe gefunden, um die Frachtkapsel zu teleportieren!
oarc-teleport-cargo-pod-success=Frachtkapsel zu dir teleportiert!
oarc-no-cargo-pods=Keine Frachtkapseln gefunden!
oarc-cleanup-30sec-warning=Kartenbereinigung in 30 Sekunden... Ungenutzte und alte Kartenabschnitte werden gelöscht!
oarc-cleanup-force-30sec-warning=Kartenbereinigung (erzwungen) in 30 Sekunden... Ungenutzte und alte Kartenabschnitte werden gelöscht!
oarc-cleanup-complete=Kartenbereinigung abgeschlossen, herzliches Beileid.
oarc-non-mod-settings-header=Zusätzliche Einstellungen (nicht im Mod-Einstellungsmenü verfügbar.)
oarc-player-self-reset-caption=Selbst zurücksetzen
oarc-player-self-reset-tooltip=Erlaubt Spielern, sich in der Spawn-Steuerung selbst zurückzusetzen.
oarc-remove-decoratives-caption=Dekorationen entfernen
oarc-remove-decoratives-tooltip=Entfernt Dekorationen im Spawn-Gebiet, damit es sauber und aufgeräumt aussieht.
oarc-resource-placement-random-order-caption=Zufällige Reihenfolge der Startressourcen
oarc-resource-placement-random-order-tooltip=Platziert die Ressourcen im Spawn-Gebiet in zufälliger Reihenfolge. Sorgt für etwas Abwechslung im Startgebiet.
oarc-world-eater-invalid-msg=Ungültige Einstellung! Der Weltfresser ist aktiviert, Regrowth aber nicht! Der Weltfresser wird deaktiviert.
oarc-default-surface-invalid-msg=Ungültige Einstellung! Die Standardoberfläche existiert nicht! Sie wird auf __PLANET__nauvis__ gesetzt.
oarc-research-finished=Team __1__ hat [technology=__2__] erforscht!
oarc-research-finished-infinite=Team __1__ hat [img=technology.__2__] [color=green][Technologie: __3__ __4__][/color] erforscht!
oarc-command-dude-wheres-my-cargo-pod=Versucht, alle Frachtkapseln deines Teams aus der Kartenmitte zu dir zu teleportieren. Benutze das, wenn eine Frachtkapsel in der Kartenmitte statt an deinem Spawn landet.
oarc-command-reroll-spawn=Verschiebt deinen Spawn auf der Oberfläche, auf der du bist, zum nächsten freien Startpunkt. Das geht einmal pro Oberfläche. Admins können jeden beliebig oft verschieben: /oarc-reroll-spawn [spieler] Achtung: Alles, was an deinem aktuellen Spawn gebaut wurde oder gelandet ist, geht verloren. Ist dort etwas, wirst du zuerst gewarnt und hast 60 Sekunden, um den Befehl erneut auszuführen. Solange eine Frachtkapsel unterwegs ist oder ein Spieler eines anderen Teams in der Nähe ist, ist das Verschieben gesperrt.
oarc-spawn-rerolled=__1__ hat seinen Spawn-Punkt auf __2__ verschoben!
oarc-reroll-spawn-command=Wenn dein Spawn Probleme hat, kannst du ihn einmal mit /oarc-reroll-spawn verschieben. Achtung: Alles, was an deinem aktuellen Spawn gebaut wurde oder gelandet ist, geht verloren. Ist dort etwas, wirst du zuerst gewarnt und hast 60 Sekunden, um den Befehl erneut auszuführen. Solange eine Frachtkapsel unterwegs ist oder ein Spieler eines anderen Teams in der Nähe ist, ist das Verschieben gesperrt.
oarc-reroll-used-up=Du hast deinen Spawn auf __1__ schon einmal verschoben. Frag einen Admin, wenn du es noch einmal brauchst.
oarc-reroll-no-spawn=__1__ besitzt keinen Spawn auf __2__. Nur der Besitzer eines Spawns kann ihn verschieben, und nur, während er auf dieser Oberfläche ist.
oarc-reroll-no-character=__1__ hat gerade keinen Charakter, daher kann der Spawn nicht verschoben werden.
oarc-reroll-confirm-warning=__1__ Gebäude und __2__ gelandete Frachtkapseln mit Gegenständen sind innerhalb von 3 Chunks um den Spawn von __3__ auf __4__. Sie gehen verloren. Führe den Befehl innerhalb von 60 Sekunden erneut aus, um trotzdem zu verschieben.
oarc-reroll-blocked-player=__1__ ist am Spawn auf __2__. Du kannst nicht verschieben, solange ein Spieler eines anderen Teams innerhalb von 3 Chunks ist.
oarc-reroll-blocked-cargo-pod=Eine Frachtkapsel ist noch auf dem Weg nach __1__. Warte, bis sie gelandet ist, und versuche es dann erneut.
oarc-command-cleanup-player=Räumt die Basis eines Spielers auf und setzt ihn zurück. Das hat dieselbe Wirkung, wie wenn ein Spieler das Spiel früh verlässt. Nützlich, um verlassene Basen aufzuräumen. Es gibt KEINE BESTÄTIGUNG und kein RÜCKGÄNGIG, sei vorsichtig!
oarc-command-cleanup-player-usage=Verwendung: /oarc-cleanup-player [spielername]
oarc-command-cleanup-player-online=Der Spieler muss offline sein, um diesen Befehl zu nutzen!
oarc-command-not-admin-warning=Befehl (__1__) kann nicht ausgeführt werden - du bist kein Admin.
oarc-spawn-ground-text-welcome=Willkommen
oarc-spawn-ground-text-home=Heimat

