oarc-classic-faq-what-is-this-mod=Was ist dieser Mod?
oarc-classic-faq-what-is-this-mod-answer=Dieser Mod gibt jedem Spieler ein eigenes Startgebiet und ein eigenes Team (Force). Der Unterschied zwischen meinem ursprünglichen Mod und dieser "Classic"-Version ist, dass diese die eingebaute Unterstützung von Factorio für mehrere Startpunkte pro Oberfläche nutzt, was mit anderen Mods deutlich kompatibler sein sollte. Außerdem bekommst du in Space Age ein normales Spielerlebnis: Frachtkapseln landen am richtigen Ort und es gibt keine Teleport-Tricks. Alles andere, was für die Kernfunktion des Mods nicht unbedingt nötig ist, habe ich entfernt. Die einzige große Einschränkung ist, dass jedes Team nur einen Startpunkt haben kann. Wenn du dir ein Team mit anderen Spielern teilen willst, musst du ihrer Basis beitreten. Dieser Mod ist für Koop gedacht, nicht für PvP.

oarc-classic-faq-starting-points=Wie wird mein Spawn-Ort ausgewählt?
oarc-classic-faq-starting-points-answer=Der Server-Host legt fest, wie viele Startpunkte jeder Planet hat und wie weit sie auseinanderliegen. Neue Spawns bekommen den nächsten freien Punkt, spiralförmig von der Kartenmitte nach außen. Ein Punkt wird übersprungen, wenn schon jemand die Gegend um ihn herum erkundet hat. Wird ein Spawn aufgeräumt, wird sein Gebiet neu generiert und der Punkt kann wieder verwendet werden. Es gibt kein Beitrittslimit, aber sobald alle Punkte vergeben sind, müssen neue Spieler dem Spawn eines anderen beitreten.

oarc-classic-faq-oarc-style-spawn=Was ist ein Spawn im OG-Oarc-Stil?
oarc-classic-faq-oarc-style-spawn-answer=Wenn der Host es erlaubt, hat das Spawn-Menü ein Kästchen "OG-Oarc-Spawn". Es baut den klassischen vorgefertigten Spawn-Kreis in deinem Startgebiet: einen Kreis aus garantiertem Land mit einem Baumring, voreingestellte Startressourcen, einen Flüssigkeitsstreifen und einen optionalen Graben. Sonst bekommst du das Vanilla-Startgebiet. Deine Startgebiete auf anderen Planeten verwenden denselben Stil, den du auf deinem ersten Planeten gewählt hast.

oarc-classic-faq-other-surfaces=Kann ich auf einer anderen Oberfläche/Planet starten?
oarc-classic-faq-other-surfaces-answer=[color=red]Ich empfehle nur einen Start auf [planet=nauvis] __PLANET__nauvis__ oder einer __PLANET__nauvis__-ähnlichen Oberfläche.[/color] Kurz gesagt geht es, aber du willst es wahrscheinlich nicht. Es gibt keinen einfachen Weg, auf anderen Planeten zu starten, ohne den normalen Spielfortschritt zu zerstören. Es gibt andere Mods wie Any Planet Start, aber deren Kompatibilität habe ich noch nicht getestet.

oarc-classic-faq-secondary-spawns=Was passiert auf anderen Planeten?
oarc-classic-faq-secondary-spawns-answer=Wenn du zum ersten Mal zu einem anderen Planeten reist, bekommst du automatisch einen frischen Startpunkt auf diesem Planeten, genau wie in einem normalen Spiel, im selben Spawn-Stil wie dein erster Spawn. Deine Frachtkapseln werden nahtlos zu diesem Landegebiet geschickt, egal ob du zuerst landest oder deine Fracht. Auf [planet=fulgora] __PLANET__fulgora__ gehören die Blitzableiter aus der Kartengenerierung dem Team mit dem nächstgelegenen Spawn, sodass du die in der Nähe deiner Basis abbauen kannst.

oarc-classic-faq-reroll=Ich bin mit meinem Spawn unzufrieden, was kann ich tun?
oarc-classic-faq-reroll-answer=Benutze /oarc-reroll-spawn, während du auf diesem Planeten bist, um deinen Spawn zum nächsten freien Startpunkt zu verschieben. Dein altes Spawn-Gebiet wird gelöscht, wenn das Aufräumen verlassener Basen aktiv ist, und Spieler, die dir dort beigetreten sind, ziehen mit dir um. Wenn es keine freien Startpunkte gibt, passiert nichts und du behältst deinen Versuch. Admins können jeden beliebig oft mit /oarc-reroll-spawn [spieler] verschieben. Achtung: Alles, was an deinem aktuellen Spawn gebaut wurde oder gelandet ist, geht verloren. Ist dort etwas, wirst du zuerst gewarnt und hast 60 Sekunden, um den Befehl erneut auszuführen. Solange eine Frachtkapsel unterwegs ist oder ein Spieler eines anderen Teams in der Nähe ist, ist das Verschieben gesperrt.

oarc-classic-faq-what-are-teams=Was sind die verschiedenen Team-Optionen?
oarc-classic-faq-what-are-teams-answer=Ich habe diesen Mod nur für Koop geschrieben, nicht für PvP, aber du kannst Waffenstillstand und freundliche Teams in den Einstellungen deaktivieren, wenn du es wirklich willst. Jeder Spieler, der einen neuen Spawn startet, bekommt sein eigenes Team mit eigenem Forschungsbaum. Spieler, die dem Spawn eines anderen beitreten, kommen in dessen Team. Alle Teams sind einander freundlich gesinnt, können im Chat kommunizieren und (optional) die Kartensicht teilen.

oarc-classic-faq-evolution-reset=Warum wurde die Evolution der Feinde zurückgesetzt?
oarc-classic-faq-evolution-reset-answer=Wenn der Host "Reset evolution on new spawn" aktiviert hat, wird die Evolution der Feinde auf einem Planeten jedes Mal auf 0 zurückgesetzt, wenn dort jemand einen neuen Spawn startet (auch bei sekundären Spawns und beim Verschieben eines Spawns). So starten Spieler, die später beitreten, nicht gegen voll entwickelte Feinde. Das betrifft alle auf diesem Planeten. Dem Spawn eines anderen beizutreten setzt nichts zurück.

oarc-classic-faq-shared-spawn=Was ist ein geteilter Spawn?
oarc-classic-faq-shared-spawn-answer=Spieler können anderen Spielern erlauben, ihrer Basis beizutreten. Dies ermöglicht es neuen Spielern, im selben Startgebiet wie der Host-Spieler zu spawnen. Der Host-Spieler kann kontrollieren, wer seiner Basis beitreten darf.

oarc-classic-faq-regrowth=Was sind die Regrowth- und "Weltfresser"-Funktionen?
oarc-classic-faq-regrowth-answer="Regrowth" hilft, die Speicherdateigröße zu reduzieren, indem inaktive Kartenabschnitte im Laufe der Zeit entfernt werden. Dies ist nützlich für langfristige Server mit vielen Spielern. Keine Bereiche mit Spieleraktivität werden entfernt. Der "Weltfresser" überprüft langsam jeden Kartenabschnitt, um zu sehen, ob dort Spielerstrukturen vorhanden sind. Dies ist eine zusätzliche Überprüfung zur Regrowth-Funktion, die Kartenabschnitte erfasst, in denen Spieler gebaut, aber später alle Strukturen entfernt haben. Ehrlich gesagt empfehle ich keine dieser Funktionen, außer du machst dir bei lang laufenden Spielen wirklich Sorgen um die Größe der Speicherdatei.

oarc-classic-faq-cleanup-abandoned=Was ist die Funktion „Aufräumen verlassener Basen“?
oarc-classic-faq-cleanup-abandoned-answer=Wenn ein Spieler das Spiel innerhalb der „Mindest-Onlinezeit“ verlässt, werden sein Charakter und sein Spawn-Gebiet gelöscht. Das Gebiet wird als frisches Startgebiet neu generiert, und der Startpunkt kommt zurück in den Pool für den nächsten neuen Spieler. Öffentliche Server sollten diese Funktion wahrscheinlich aktivieren. Sie funktioniert auch, wenn Regrowth und Weltfresser deaktiviert sind.

oarc-classic-faq-offline-protection=Was ist die Funktion "Offline-Schutz"?
oarc-classic-faq-offline-protection-answer=Wenn eine Basis keine Spieler online hat, wird sie vor feindlichen Angriffen geschützt. Dies ist nicht 100% garantiert, aber es hilft, die Basis zu schützen, wenn die Spieler offline sind.

oarc-surface-settings-info=Hiermit können Sie die Oberflächeneinstellungen konfigurieren. Diese Funktion ist nur für Administratoren verfügbar. Diese Einstellungen sind NICHT auf der Mod-Einstellungsseite verfügbar. Wenn Sie diese Einstellungen beim Start eines neuen Spiels automatisch mithilfe einer benutzerdefinierten Datei festlegen möchten, sehen Sie sich bitte das im Mod-Ordner enthaltene Vorlagenszenario an. Ich frage mich wirklich, warum ich mir die Mühe gemacht habe, dieses GUI-Interface zu erstellen. Bitte um Hilfe.
oarc-surface-settings-warning=WARNUNG: Diese Einstellungen sind NICHT bereinigt. Das Spiel könnte abstürzen, wenn Sie schlechte Werte auswählen!
oarc-surface-settings-prefab-only-note=Ressourcen im Spawn-Gebiet und der Flüssigkeitsstreifen werden nur in Spawns im Oarc-Stil platziert. Aktiviere "Allow Oarc Style Spawn Circle" in den Mod-Einstellungen, um sie hier einzustellen.

