oarc-command-dude-wheres-my-cargo-pod=如果货运舱与你属于同一队伍，此命令将尝试把地图中心的货运舱传送到你身边。当货运舱落在地图中心而不是你的基地时使用。
oarc-command-reroll-spawn=将你在当前空间（星球）上的基地移到下一个空闲起始点。每个空间（星球）只能使用一次。管理员可以不限次数地为任何人重新选点：/oarc-reroll-spawn [玩家]警告：你当前基地上建造的所有东西和已降落的货运舱都会丢失。如果那里有东西，你会先收到警告，并需在 60 秒内再次执行该命令。有货运舱仍在途中或其他队伍的玩家在附近时，无法重新选点。
oarc-spawn-rerolled=__1__ 已将他们在 __2__ 上的基地重新选点！
oarc-reroll-spawn-command=如果你的基地有问题，你可以使用 /oarc-reroll-spawn 将它移动一次。警告：你当前基地上建造的所有东西和已降落的货运舱都会丢失。如果那里有东西，你会先收到警告，并需在 60 秒内再次执行该命令。有货运舱仍在途中或其他队伍的玩家在附近时，无法重新选点。
oarc-reroll-used-up=你已经在 __1__ 上用过重新选点了。如需再次使用，请联系管理员。
oarc-reroll-no-spawn=__1__ 在 __2__ 上没有自己的基地。只有基地主人站在该空间（星球）上时才能重新选点。
oarc-reroll-no-character=__1__ 当前没有角色，因此无法重新选点。
oarc-reroll-confirm-warning=__3__ 在 __4__ 上的基地 3 个区块范围内有 __1__ 个建筑和 __2__ 个装有物品的已降落货运舱。它们将会丢失。请在 60 秒内再次执行该命令以继续重新选点。
oarc-reroll-blocked-player=__1__ 正在 __2__ 上的基地中。其他队伍的玩家在 3 个区块范围内时，无法重新选点。
oarc-reroll-blocked-cargo-pod=有货运舱仍在前往 __1__ 的途中。请等它降落后再试。
oarc-command-cleanup-player=清理一名玩家的基地并重置该玩家，效果与玩家过早离开游戏相同。可用于清理废弃的基地。此操作没有确认，也无法撤销，请小心！
oarc-command-cleanup-player-usage=用法：/oarc-cleanup-player [玩家名]
oarc-command-cleanup-player-online=该玩家必须离线才能使用此命令！
oarc-command-not-admin-warning=无法执行命令 (__1__) - 你不是管理员。

