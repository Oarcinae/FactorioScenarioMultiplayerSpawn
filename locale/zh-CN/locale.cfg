oarc-classic-faq-what-is-this-mod=这是什么模组？
oarc-classic-faq-what-is-this-mod-answer=此模组让每位玩家都拥有自己的初始区域和自己的势力（队伍）。与我原来的模组相比，这个“经典”版本使用了 Factorio 内置的每个地表多起始点支持，因此与其他模组的兼容性应该会好得多。在太空时代中你也能获得正常的游戏体验：货运舱会降落在正确的位置，没有任何传送的取巧手段。其他对模组核心功能并非绝对必要的内容我都删掉了。唯一的主要限制是每个势力只能有一个起始点。如果你想和其他玩家共享一个势力，就必须加入他们的基地。此模组专为合作游戏设计，而不是 PvP。

oarc-classic-faq-starting-points=我的基地位置是怎么选的？
oarc-classic-faq-starting-points-answer=服务器主机决定每个星球有多少个起始点以及它们之间的间距。新基地会占用下一个空闲起始点，从地图中心向外呈螺旋排列。如果某个起始点周围的区域已经被人探索过，它会被跳过。基地被清理后，其区域会重新生成，该起始点可以再次使用。加入人数没有上限，但所有起始点都被占用后，新玩家只能加入别人的基地。

oarc-classic-faq-oarc-style-spawn=什么是经典 Oarc 风格基地？
oarc-classic-faq-oarc-style-spawn-answer=如果主机允许，出生菜单中会有一个“经典 Oarc 风格基地”复选框。它会在你的初始区域中建造经典的预制圆形基地：一片保证有陆地并带有树环的圆形区域、预设的初始资源、一个水坑以及可选的护城河。否则你会得到原版初始区域。你在其他星球上的初始区域会使用与你在第一个星球上选择的相同风格。

oarc-classic-faq-other-surfaces=我可以从不同的空间/星球开始吗？
oarc-classic-faq-other-surfaces-answer=[color=red]推荐在[planet=nauvis]__PLANET__nauvis__或类似__PLANET__nauvis__的默认空间（星球）上开始游戏。[/color]简短的回答是可以，但你可能并不想这样做。没有简单的方法可以确保你能在其他行星上开始游戏而不破坏正常的游戏进程和玩法。还有其他一些模组，比如“任意行星开局”（Any Planet Start），但我尚未测试过兼容性。

oarc-classic-faq-secondary-spawns=在其他星球上会怎样？
oarc-classic-faq-secondary-spawns-answer=当你第一次前往另一个星球时，你会像普通游戏一样自动在该星球上获得一个全新的起始点，风格与你的第一个基地相同。无论是你先着陆还是货物先着陆，你的货运舱都会被无缝送到该着陆区域。在[planet=fulgora]__PLANET__fulgora__上，地图生成的避雷器属于离它最近的基地所在的队伍，因此你可以拆除基地附近的避雷器。

oarc-classic-faq-reroll=我对我的基地位置不满意，该怎么办？
oarc-classic-faq-reroll-answer=站在该星球上时使用 /oarc-reroll-spawn，即可把你的基地移到下一个空闲起始点。如果启用了废弃基地清理，你原来的基地区域会被删除，在那里加入你的玩家也会随你一起搬走。如果没有空闲起始点，则什么都不会发生，你的次数也会保留。管理员可以使用 /oarc-reroll-spawn [玩家] 不限次数地为任何人重新选点。警告：你当前基地上建造的所有东西和已降落的货运舱都会丢失。如果那里有东西，你会先收到警告，并需在 60 秒内再次执行该命令。有货运舱仍在途中或其他队伍的玩家在附近时，无法重新选点。

oarc-classic-faq-what-are-teams=不同的队伍选项是什么？
oarc-classic-faq-what-are-teams-answer=这个模组致力于合作游戏，不是为了 PvP，但如果你真的想要，可以在设置中禁用停火和友军队伍。每个创建新基地的玩家都会获得自己的队伍，拥有自己的科技树。加入别人基地的玩家会加入该玩家的队伍。所有队伍之间都是友好的，可以在聊天中交流，并且（可选地）共享地图视野。

oarc-classic-faq-evolution-reset=为什么敌人进化度被重置了？
oarc-classic-faq-evolution-reset-answer=如果主机启用了“新基地时重置进化度”，每当有人在某个星球上创建新基地（包括副基地和重新选点）时，该星球上的敌人进化度都会重置为 0，这样后加入的玩家就不会面对完全进化的敌人。这会影响该星球上的所有人。加入别人的基地不会重置进化度。

oarc-classic-faq-shared-spawn=什么是共享基地？
oarc-classic-faq-shared-spawn-answer=玩家可以选择允许其他玩家加入他们的基地。这允许新玩家在同一初始区域基地为主机玩家。主机玩家可以控制谁能加入他们的基地。

oarc-classic-faq-regrowth=再生和世界吞噬者特性是什么？
oarc-classic-faq-regrowth-answer="再生"通过随着时间移除不活跃的地图区块来帮助减少存档文件大小。这对于有许多玩家的长期运行服务器很有用。不会有带有玩家活动的区块被移除。“世界吞噬者”会缓慢检查每个区块，看看其中是否有玩家结构。这是在再生特性之上的额外检查，它将捕捉到玩家建造后又移除了所有结构的区块。说实话，除非你真的很在意长期游戏的存档大小，否则我不建议启用这两个功能。

oarc-classic-faq-cleanup-abandoned=废弃基地清理特性是什么？
oarc-classic-faq-cleanup-abandoned-answer=如果玩家在“最短在线时间”内离开，此功能会删除他们的角色和基地区域。该区域会重新生成为全新的初始区域，起始点也会回到池中，留给下一位新玩家。公共服务器可能希望启用此功能。即使再生和世界吞噬者已禁用，它也能工作。

oarc-classic-faq-offline-protection=离线保护特性是什么？
oarc-classic-faq-offline-protection-answer=如果一个基地的所有玩家都离线，它将受到敌人的攻击保护。这不是百分之百保证的，但它会在玩家离线时帮助防止基地被摧毁。

oarc-surface-settings-info=此处可以配置空间（星球）设置，仅管理员可用。这些设置在模组设置页面中不可用。如果你想在新游戏开始时使用自定义文件自动设置这些选项，请查看模组文件夹中附带的模板场景。我真的开始怀疑自己的理智了，居然费劲做了这个图形界面。救救我吧。
oarc-surface-settings-warning=警告：这些设置未经数值验证，设置不当可能导致游戏崩溃！
oarc-surface-settings-prefab-only-note=基地区域资源和水坑只会放置在 Oarc 风格基地中。在模组设置中启用“允许 Oarc 风格圆形基地”后即可在此配置。

