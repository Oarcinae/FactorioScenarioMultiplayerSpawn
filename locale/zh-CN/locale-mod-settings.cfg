[mod-description]
oarc-classic=一个基于原版初始区域的多人出生模组。游戏开始时，每个星球都会获得一个固定的起始点网格，每位新玩家会从中心向外螺旋依次占用下一个空闲起始点。玩家也可以加入别人的基地。更多信息请查看模组设置和游戏内界面。\n\n[font=default-small]要用此模组开始新游戏，只需使用默认的自由模式场景。[/font]

